low:
  description: Mechanical or reversible work.
  required:
    - summarize-intent
    - run-basic-check
  examples:
    - formatting
    - typo fixes
    - small docs edits

medium:
  description: Normal code change where behavior can break.
  required:
    - trace-the-code
    - failing-test-first
    - diff-interrogation
  examples:
    - bug fix
    - small feature
    - dependency bump
    - validation change

high:
  description: Risky change with security, data, public API, permissions, or destructive behavior.
  required:
    - problem-framing
    - assumption-audit
    - alternatives-before-code
    - rollback-plan
    - authorization-check
    - mechanism-summary
  examples:
    - auth changes
    - permissions
    - destructive scripts
    - migrations
    - public API changes
    - production config
    - tool or agent permissions

# Evidence depth does not itself require a new approval. Reuse authorization
# already given for the action; ask only for missing authorization to send,
# publish, destroy data, widen permissions or change production state.
# These are evidence categories, not instructions to load every named skill.
# Coaching and mechanism exercises require an explicit learning request.
