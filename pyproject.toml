[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-deadlift"
version = "0.1.0"
description = "A skill-retention harness for developers using AI coding assistants."
authors = [{name = "Alinafe Matenda"}]
maintainers = [{name = "Alinafe Matenda"}]
license = "MIT AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "LICENSE-CONTENT", "NOTICE"]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/alinafe82/cognitive-deadlift"
Repository = "https://github.com/alinafe82/cognitive-deadlift"
Issues = "https://github.com/alinafe82/cognitive-deadlift/issues"

[project.optional-dependencies]
test = [
  "pytest>=9.1.1",
]
lint = [
  "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools]
packages = []
py-modules = []
